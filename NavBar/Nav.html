    <style>
      @import url('https://fonts.cdnfonts.com/css/lovelace');
      :root {
        --nav-text-light: #000;
        --nav-text-dark: #fff;
        --navtoggler:#6b6f8d;
        --navtoggler-color:white;

      }
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        transition: background-color var(--transition-speed),
          color var(--transition-speed);
      }

      body.dark-mode .navbar-nav .nav-item .btn {
        color: var(--nav-text-dark) !important;
        --navtoggler-color:#484b6a;
      }

      body.dark-mode .navbar-nav .nav-item .btn:hover {
        background-color: #343a40 !important;
        color: var(--nav-text-dark) !important;
      }

      body:not(.dark-mode) .navbar-nav .nav-item .btn {
        color: var(--nav-text-light) !important;
      }

      body:not(.dark-mode) .navbar-nav .nav-item .btn:hover {
        background-color: #e2e6ea !important;
        color: var(--nav-text-light) !important;

      }

      .navbar {
        background-color: transparent !important;
        color: var(--navbar-text) !important;
        box-shadow: 0 2px 10px var(--shadow-color);
        transition: background-color var(--transition-speed);
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
      }
      .navbar-brand,
      .nav-link {
        color: var(--navbar-text) !important;
        transition: color var(--transition-speed);
        
      }
      .dropdown-menu {
        background-color: var(--card-bg);
        border-color: var(--border-color);
      }
      .dropdown-item {
        color: var(--text-primary);
      }
      .dropdown-item:hover {
        background-color: var(--bg-secondary);
        color: var(--text-primary);
      }
      /* Center navigation items */
      .navbar-nav.mx-auto {
        display: flex;
        justify-content: center;
        width: 100%;
        gap: 0.5rem;
      }
      .navbar-nav.mx-auto .nav-item {
        text-align: center;
      }
      
      /* Change navbar buttoncolor */
      .navbar-nav.mx-auto .nav-item .btn {
        background-color: var(--btn-bg) !important;
        color:white;
      }
      
      .navbar-nav ms-auto{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        box-shadow: 0 2px 10px var(--shadow-color);
        background-color: var(--bg-primary);
        color: var(--navbar-text);
        transition: all var(--transition-speed);
      }
      /* Add styles for navbar-toggler */
      .navbar-toggler {
        border: 1px solid var(--nav-text-light);
        background: var(--navtoggler);
        color: var(--navtoggler-color);
      }

      .navbar-toggler-icon {
        background-image: none;
        position: relative;
      }

      .navbar-toggler-icon::before {
        content: '☰';
        font-size: 1.5rem;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--text-primary);
      }

      .navbar.show-nav {
  background-color: var(--bg-primary) !important;
}

.navbar-collapse {
  transition: all 0.3s ease;
}

/*Logo Name */
  
.navbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-family: 'Lovelace';
  background: #C5C9E1;



  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  transition: all 0.3s ease;
}

.navbar-brand:hover {
  transform: scale(1.05);
 background: linear-gradient(45deg, #fff, #e2e2e2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

body.dark-mode .navbar-brand {
  background: #C5C9E1;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

    <script>
      function toggleTheme() {
        const sun = document.getElementById("sunIcon");
        const moon = document.getElementById("moonIcon");

        // Toggle dark mode class
        document.body.classList.toggle("dark-mode");

        // Toggle icon visibility
        if (document.body.classList.contains("dark-mode")) {
          sun.style.display = "inline";
          moon.style.display = "none";
        } else {
          sun.style.display = "none";
          moon.style.display = "inline";
        }
      }
    </script>
