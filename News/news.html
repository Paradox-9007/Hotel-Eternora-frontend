<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../theme.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">

    <style>
      
      body {
     
    font-family: 'Lora', serif;
  

      }
      .container {
        margin-top: 20px;
      }
      .news-card {
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 30px;
        transition: transform 0.2s;
      }
      .news-card:hover {
        transform: translateY(-5px);
      }
      .news-item {
        display: flex;
        gap: 25px;
        align-items: flex-start;
      }
      .news-image {
        width: 280px;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .news-text {
        flex: 1;
      }
      .news-title {
        color: #537942;
      }
      .read-more-btn {
        background-color: var(--CalenCarol);
        color: var(--navbar-text);
        border: none;
        padding: 8px 15px;
        cursor: pointer;
        margin-top: 10px;
        border-radius: 5px;
        transition: background var(--transition-speed);
      }
      .read-more-btn:hover {
        background-color:  #537942;
      }
      .news-content {
        display: none;
        margin-top: 10px;
      }
      .filter-container {
        text-align: center;
        margin-bottom: 20px;
      }
      .category-dropdown {
        padding: 10px;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-primary);
      }
      @media (max-width: 768px) {
        .news-item {
          flex-direction: column;
        }
        .news-image {
          width: 100%;
          margin-bottom: 20px;
        }
      }
      img {
        max-width: 100%;
        height: auto;
        margin: 10px 0;
      }

      .scroll-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: rgb(9, 9, 9);
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 80%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: 1000;
      }

      .scroll-top.show {
        opacity: 1;
        visibility: visible;
      }

      .scroll-top:hover {
        background-color: var(--accent-hover);
        transform: translateY(-3px);
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Bootstrap JS and nav.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../NavBar/nav.js"></script>

    <!-- Font Awesome CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <!-- Scroll to top button -->
    <a class="scroll-top" title="Back to Top">
      <i class="fa fa-angle-up" aria-hidden="true"></i>
    </a>

    <script>
      // Scroll to top functionality
      const scrollTopBtn = document.querySelector(".scroll-top");

      window.addEventListener("scroll", () => {
        if (window.pageYOffset > 100) {
          scrollTopBtn.classList.add("show");
        } else {
          scrollTopBtn.classList.remove("show");
        }
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      });
    </script>

    <!-- Scroll to top button -->
    <a class="scroll-top" title="Back to Top">
      <i class="fa fa-angle-up" aria-hidden="true" style="font-size:24px"></i>
    </a>

    <!-- <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="#">News Portal</a>
      </div>
    </nav> -->

    <div class="container">
      <h1 class="text-center my-4" style="font-family: 'Lora', serif;">Latest News</h1>

      <!-- Dropdown filter -->
      <div class="filter-container">
        <label for="category" style="font-family: 'Lora', serif;"><strong>Select Category:</strong></label>
        <select id="category" class="category-dropdown" onchange="filterNews()">
          <option value="all">All News</option>
          <option value="traveltrendsandfocus">Travel Trends & Focus</option>
          <option value="traveltechnologynews">Travel Technology News</option>
          <option value="travelassociationnews">Travel Association News</option>
        </select>
      </div>

      <div id="news-container"></div>
    </div>

    <script>
      // Define news sources with categories
      const newsSources = [
        {
          url: "https://grooveintheback.onrender.com/api/news/traveltrendsandfocus",
          category: "traveltrendsandfocus",
        },
        {
          url: "https://grooveintheback.onrender.com/api/news/traveltechnologynews",
          category: "traveltechnologynews",
        },
        {
          url: "https://grooveintheback.onrender.com/api/news/travelassociationnews",
          category: "travelassociationnews",
        },
      ];

      let allNewsItems = [];

      // Fetch all news sources
      const urlParams = new URLSearchParams(window.location.search);
      const selectedCategory = urlParams.get("category");
      const selectedTitle = urlParams.get("title");

      Promise.all(
        newsSources.map((source) =>
          fetch(source.url)
            .then((response) => response.json())
            .then((data) => ({ data, category: source.category }))
            .catch((error) => {
              console.error(`Error fetching ${source.url}:`, error);
              return null;
            })
        )
      ).then((results) => {
        const newsContainer = document.getElementById("news-container");
        allNewsItems = [];

        results.forEach((result) => {
          if (
            result &&
            result.data &&
            result.data.rss &&
            result.data.rss.channel &&
            result.data.rss.channel.item
          ) {
            const category = result.category;
            result.data.rss.channel.item.forEach((news) => {
              allNewsItems.push({ ...news, category });
            });
          }
        });

        if (allNewsItems.length === 0) {
          newsContainer.innerHTML =
            "<p class='text-center'>No news available.</p>";
          return;
        }

        renderNews("all");
      });

      function renderNews(category) {
        const newsContainer = document.getElementById("news-container");
        let output = "";

        allNewsItems.forEach((news, index) => {
          if (category !== "all" && news.category !== category) {
            return;
          }

          const headline = news.title || "No Title";
          const author = news["dc:creator"] || "Unknown Author";
          const pubDate = news.pubDate
            ? new Date(news.pubDate).toLocaleString("en-US", {
                timeZone: "Asia/Bangkok",
              }) + " (Bangkok Time, GMT+7)"
            : "Unknown Date";

          const descriptionMatch = news.description
            ? news.description.match(/<p>.*?<\/p>/)
            : null;
          const description = descriptionMatch
            ? descriptionMatch[0]
            : "No Description";

          let newsContent = news["content:encoded"] || "No Content Available";
          newsContent = newsContent.replace(
            /<a\s+[^>]*href=["'][^"']*["'][^>]*>/g,
            "<a>"
          );
          newsContent = newsContent.replace(
            /<h1[^>]*>In case you missed it:<\/h1>[\s\S]*?<p><strong>Read more .*?<\/p>/,
            ""
          );

          const imageMatch = newsContent.match(
            /<img[^>]*src=["']([^"']*)["'][^>]*>/i
          );
          const imageUrl = imageMatch
            ? imageMatch[1]
            : "https://via.placeholder.com/100x80";

          const contentWithoutImages = newsContent.replace(/<img[^>]*>/g, "");

          output += `
            <div class="news-card">
              <div class="news-item">
                <img src="${imageUrl}" alt="News Image" class="news-image" onerror="this.src='https://via.placeholder.com/100x80'" />
                <div class="news-text">
                  <h3 class="news-title" style="font-family: 'Lora', serif;">${headline}</h3>
                  <p class="news-date" style="font-family: 'Lora', serif;">📅 ${pubDate}</p>
                  <p style="font-family: 'Lora', serif;">${description}</p>
                  <button class="read-more-btn" onclick="toggleContent(${index})" style="font-family: 'Lora', serif;">Read More</button>
                  <div class="news-content" id="content-${index}" style="font-family: 'Lora', serif;">
                    ${contentWithoutImages}
                  </div>
                </div>
              </div>
            </div>`;
        });

        newsContainer.innerHTML = output;
      }

      function filterNews() {
        const category = document.getElementById("category").value;
        renderNews(category);
      }

      function toggleContent(index) {
        const content = document.getElementById(`content-${index}`);
        const button = content.previousElementSibling;

        if (content.style.display === "none" || content.style.display === "") {
          content.style.display = "block";
          button.textContent = "Show Less";
        } else {
          content.style.display = "none";
          button.textContent = "Read More";
        }
      }
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const selectedCategory = urlParams.get('category');
        const selectedTitle = urlParams.get('title');
        
        // Set the category dropdown to match the selected category
        if (selectedCategory) {
          document.getElementById('category').value = selectedCategory;
          filterNews();
        }
    
        // After news is rendered, find and scroll to the selected article
        const checkForArticle = setInterval(() => {
          const articles = document.querySelectorAll('.news-title');
          articles.forEach((article, index) => {
            if (article.textContent === selectedTitle) {
              article.scrollIntoView({ behavior: 'smooth', block: 'center' });
              article.closest('.news-card').style.backgroundColor = 'gray';
              
              // Automatically open the content
              const content = document.getElementById(`content-${index}`);
              const button = content.previousElementSibling;
              content.style.display = "block";
              button.textContent = "Show Less";
              
              setTimeout(() => {
                article.closest('.news-card').style.transition = 'background-color 0.5s ease';
                article.closest('.news-card').style.backgroundColor = '';
              }, 1500);
              clearInterval(checkForArticle);
            }
          });
        }, 100);
      });
    </script>
  </body>
</html>
