<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../theme.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Lora", serif;
      }

      .container {
        margin-top: 20px;
      }

      /* ─── News Banner ───────────────────────────────────────────── */
      .news-api-banner {
        position: relative;
        width: 100%;
        margin: 30px auto;
        padding: 35px 60px;
        border-radius: 18px;
        background: linear-gradient(
          135deg,
          #8B3A3A,
          #B84A4A
        );
        color: white;
        text-align: center;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .banner-content {
        width: 100%;
      }

      .banner-title {
        font-family: "Lora", serif;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 12px;
      }

      .banner-text {
        font-family: "Lora", serif;
        font-size: 16px;
        line-height: 1.8;
      }

      .banner-close-btn {
        position: absolute;
        top: 14px;
        right: 18px;
        background: transparent;
        border: none;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .banner-close-btn:hover {
        transform: scale(1.15);
        opacity: 0.8;
      }

      /* ─── News Cards ───────────────────────────────────────────── */
      .news-card {
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 30px;
        transition: transform 0.2s;
      }

      .news-card:hover {
        transform: translateY(-5px);
      }

      .news-item {
        display: flex;
        gap: 25px;
        align-items: flex-start;
      }

      .news-image,
      .news-image-placeholder {
        width: 280px;
        height: 200px;
        border-radius: 8px;
        flex-shrink: 0;
      }

      .news-image {
        object-fit: cover;
      }

      .news-image-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;

        background-color: var(--card-bg);

        color: var(--text-primary);

        text-align: center;

        padding: 15px;

        font-size: 20px;
        font-weight: bold;
      }

      .news-text {
        flex: 1;
      }

      .news-title {
        color: #537942;
      }

      /* ─── Buttons ──────────────────────────────────────────────── */
      .read-more-btn {
        background-color: var(--CalenCarol);
        color: var(--navbar-text);

        border: none;

        padding: 8px 15px;

        cursor: pointer;

        margin-top: 10px;

        border-radius: 5px;

        transition: background var(--transition-speed);
      }

      .read-more-btn:hover {
        background-color: #537942;
      }

      /* ─── Hidden Content ───────────────────────────────────────── */
      .news-content {
        display: none;
        margin-top: 10px;
      }

      /* ─── Filter ──────────────────────────────────────────────── */
      .filter-container {
        text-align: center;
        margin-bottom: 20px;
      }

      .category-dropdown {
        padding: 10px;

        font-size: 16px;

        border-radius: 5px;

        border: 1px solid var(--border-color);

        background-color: var(--card-bg);

        color: var(--text-primary);
      }

      /* ─── Images ──────────────────────────────────────────────── */
      img {
        max-width: 100%;
        height: auto;
        margin: 10px 0;
      }

      /* ─── Scroll Top ──────────────────────────────────────────── */
      .scroll-top {
        position: fixed;

        bottom: 20px;
        right: 20px;

        background-color: rgb(9, 9, 9);

        color: white;

        width: 50px;
        height: 50px;

        border-radius: 80%;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        opacity: 0;
        visibility: hidden;

        transition: all 0.3s ease;

        z-index: 1000;
      }

      .scroll-top.show {
        opacity: 1;
        visibility: visible;
      }

      .scroll-top:hover {
        background-color: var(--accent-hover);
        transform: translateY(-3px);
      }

      /* ─── Mobile Responsive ───────────────────────────────────── */
      @media (max-width: 768px) {
        .container {
          padding-left: 16px;
          padding-right: 16px;
        }

        .news-api-banner {
          padding: 18px 14px;
          border-radius: 14px;
        }

        .banner-title {
          font-size: 15px;
        }

        .banner-text {
          font-size: 13px;
          line-height: 1.6;
        }

        .banner-close-btn {
          font-size: 24px;
          top: 10px;
          right: 14px;
        }

        .news-card {
          padding: 18px;
        }

        .news-item {
          flex-direction: column;
          gap: 16px;
        }

        .news-image,
        .news-image-placeholder {
          width: 100%;
          height: 220px;
        }

        .category-dropdown {
          width: 100%;
          max-width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/NavBar/nav.js"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <a class="scroll-top" title="Back to Top">
      <i class="fa fa-angle-up" aria-hidden="true"></i>
    </a>

    <script>
      const scrollTopBtn = document.querySelector(".scroll-top");

      window.addEventListener("scroll", () => {
        if (window.pageYOffset > 100) {
          scrollTopBtn.classList.add("show");
        } else {
          scrollTopBtn.classList.remove("show");
        }
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      });
    </script>

    <div class="container">
      <h1 class="text-center my-4" style="font-family: 'Lora', serif;">
        Latest News
      </h1>

      <div id="news-banner" class="news-api-banner">
        <button
          class="banner-close-btn"
          onclick="document.getElementById('news-banner').style.display='none'"
          aria-label="Close banner"
        >
          &times;
        </button>

        <div class="banner-content">
          <div class="banner-title">
            Notice
          </div>

          <div class="banner-text">
            Due to recent changes in third-party RSS feed and API support, our news integration has been unavailable since March 2026.          </div>
        </div>
      </div>

      <div class="filter-container">
        <label for="category" style="font-family: 'Lora', serif;">
          <strong>Select Category:</strong>
        </label>
        <select id="category" class="category-dropdown">
          <option value="all">All News</option>
          <option value="traveltrendsandfocus">Travel Trends and Focus</option>
          <option value="traveltechnologynews">Travel Technology</option>
          <option value="travelassociationnews">Travel Associations</option>
        </select>
      </div>

      <div id="news-container"></div>
    </div>

    <script src="/News/news.js"></script>
  </body>
</html>
