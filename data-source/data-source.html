<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Source</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.datatables.net/buttons/2.2.2/css/buttons.dataTables.min.css"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link href="/data-source/calendar.css" rel="stylesheet" />
    <link href="/data-source/tables.css" rel="stylesheet" />
    <link rel="stylesheet" href="/theme.css" />
    <style>
      body {
        background-color: #f4f6f9;
        font-family: "Lora", serif;
      }

      .scroll-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: rgb(9, 9, 9);
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 80%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: 1000;
      }

      .scroll-top.show {
        opacity: 1;
        visibility: visible;
      }

      .scroll-top:hover {
        background-color: var(--accent-hover);
        transform: translateY(-3px);
      }
    </style>
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <script src="/NavBar/nav.js"></script>

    <div class="container mt-4 mb-4 data-source-page">
      <section class="calendar-shell">
        <div class="calendar-controls">
          <div id="yearspace" class="control-group">
            <label for="year-select">Select Year</label>
            <select id="year-select" class="form-select">
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026">2026</option>
              <option value="2027">2027</option>
              <option value="2028">2028</option>
              <option value="2029">2029</option>
              <option value="2030">2030</option>
            </select>
          </div>

          <div id="monthspace" class="control-group">
            <label for="month-select">Select Month</label>
            <select id="month-select" class="form-select">
              <option value="1">January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>

          <div id="countryspace" class="control-group">
            <label for="country-select">Select Country</label>
            <select id="country-select" class="form-select">
              <option value="Thailand">Thailand</option>
              <option value="Myanmar">Myanmar</option>
              <option value="Indonesia">Indonesia</option>
              <option value="Singapore">Singapore</option>
              <option value="Malaysia">Malaysia</option>
              <option value="Taiwan">Taiwan</option>
            </select>
          </div>

          <div class="calendar-action-wrap">
            <button id="calendar-today-btn" class="btn calendar-action-btn" type="button">
              Current Month
            </button>
          </div>
        </div>




        <div id="fullcalendartext" class="calendar-heading-block">
          <h4 class="text-center mb-2">Full Year Calendar</h4>
          <p class="text-center mb-0">
            Holiday planning reference for Hotel Eternora destination markets.
          </p>
        </div>

        <div id="calendar" class="calendar-container">
          <div id="carouselExample" class="carousel slide" data-bs-ride="false">
            <div class="carousel-inner" id="calendar-carousel"></div>
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="prev"
            >
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="next"
            >
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
      </section>

      <section class="table-section">
        <div class="table-section-header">
          <div>
            <h4 class="text-left mt-5 mb-2">Booking Data</h4>
          </div>
          <div id="booking-table-summary" class="table-section-summary"></div>
        </div>
        <div id="booking-table"></div>
        <div id="booking_down"></div>
      </section>

      <section class="table-section">
        <div class="table-section-header">
          <div>
            <h4 class="text-left mt-5 mb-2">Client Data</h4>
          </div>
          <div id="client-table-summary" class="table-section-summary"></div>
        </div>
        <div id="client-table"></div>
        <div id="client_down"></div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.print.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/data-source/calendar.js"></script>
    <script src="/data-source/tables.js" type="module"></script>

    <a class="scroll-top" title="Back to Top">
      <i class="fa fa-angle-up" aria-hidden="true" style="font-size: 24px"></i>
    </a>

    <script>
      const scrollTopBtn = document.querySelector(".scroll-top");

      window.addEventListener("scroll", () => {
        if (window.pageYOffset > 100) {
          scrollTopBtn.classList.add("show");
        } else {
          scrollTopBtn.classList.remove("show");
        }
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      });
    </script>
  </body>
</html>
