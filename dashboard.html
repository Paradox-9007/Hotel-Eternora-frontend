<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  async function generatePDF() {
    const { jsPDF } = window.jspdf;

    const dashboard = document.querySelector('main');
    const canvas = await html2canvas(dashboard);
    const imgData = canvas.toDataURL('image/png');

    const aiText = document.getElementById("db1-ai-container")?.innerText || "No AI-generated summary found.";

    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const imgProps = pdf.getImageProperties(imgData);
    const imgHeight = (pageWidth * imgProps.height) / imgProps.width;

    pdf.addImage(imgData, 'PNG', 0, 10, pageWidth, imgHeight);
    pdf.addPage();
    pdf.setFontSize(14);
    pdf.text("AI Generated Summary", 10, 20);
    pdf.setFontSize(11);
    pdf.text(aiText, 10, 30, { maxWidth: 190 });

    pdf.save("report.pdf");
  }
</script>
