      background: #c1c1c1;
      border-radius: 10px;
    }
    
    .birthday-table-container::-webkit-scrollbar-thumb:hover,

      background: #a8a8a8;

<!-- Multi-language Speech-to-Text Script -->
<script>
    document.querySelectorAll('button[id$="-speech-to-text"]').forEach(button => {
      button.addEventListener('click', () => {
        const inputId = button.id.replace('-speech-to-text', '-ai-response-input');
        const inputElement = document.getElementById(inputId);
        const langSelector = document.getElementById("speech-lang-select");
        const selectedLang = langSelector ? langSelector.value : 'en-US';
  
        if (!inputElement) return;
  
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Your browser does not support Speech Recognition. Please use Chrome.");
          return;
        }
  
        const recognition = new SpeechRecognition();
        recognition.lang = selectedLang;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
  
        recognition.start();
  
        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          inputElement.value = transcript;
        };
  
        recognition.onerror = function(event) {
          alert("Speech recognition error: " + event.error);
        };
      });
    });
  </script>
 



<script>
    import { drawBarChart,drawDonutChart } from '../drawChart.js';
    import { fetchClientRequest, fetchBookingsRequest } from '../APIcaller.js'
    import { getAllClientBirthdays } from '../processData.js';
    import { generateAiContent } from '../aiAnalysis.js'

// AI START xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx


let kpi_for_ai = new Proxy({}, {
    set(target, key, value) {
        target[key] = value;
        // Removed automatic call to updateAIAnalysis()
        return true;
    }
});

document.getElementById('db5-ai-container').style.display = 'none';
document.getElementById('D5-input-container').style.display = 'none';

document.getElementById('D5-generate-ai-report-button').addEventListener('click', () => {
    updateAIAnalysis();
    document.getElementById('D5-input-container').style.display = 'block';
    document.getElementById('db5-ai-container').style.display = 'block';
    document.getElementById('D5-generate-ai-report-button').style.display = 'none';
});

// Store the last used prompt to use for retries
let lastUsedPrompt = '';

function updateKpiForAi(key, value) {
    kpi_for_ai[key] = value;
}
async function updateAIAnalysis() {
    const aiAnalysisElement = document.getElementById('D5-ai-analysis');
    const retryButton = document.getElementById('D5-retry-ai-analysis');
    const responseInput = document.getElementById('D5-ai-response-input');
    const inputTaker = document.getElementById('D5-input-container');

    if (!aiAnalysisElement) return;

    // Hide retry button and input container initially
    retryButton.style.display = 'none';
    inputTaker.style.display = 'none';

    // Show loading state
    aiAnalysisElement.innerHTML = `
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">Generating</p>
        </div>
    `;

    // Define the default prompt
    const defaultPrompt = `Generate analytic reports on:
        "Guest Birthday Trends: Forecasting Special Event Bookings"
        "Celebration Projections: How Birthdays Impact Future Bookings"
        "Predicting Guest Celebrations: Monthly Birthday & Booking Insights"`;

    // Determine the prompt to use
    const userPrompt = responseInput.value.trim();
    
    // Update last used prompt, prioritizing user input
    lastUsedPrompt = userPrompt || lastUsedPrompt || defaultPrompt;

    const chartDataString = Object.values(kpi_for_ai).filter(Boolean).join('\n');
    const combinedPrompt = `${lastUsedPrompt}\nBased on the following booking data:\n${chartDataString}`;

    try {
        console.log(`Generating AI content`);
        
        // Improved timeout and error handling
        const generatePromise = generateAiContent('D5-ai-analysis', combinedPrompt, '');
        
        const status = await Promise.race([
            generatePromise,
            new Promise((_, reject) => setTimeout(() => {
                console.log(`Timeout`);
                reject(new Error('Request timeout'));
            }, 30000))
        ]);

        console.log(`Status:`, status);

        if (status === 'success') {
            inputTaker.style.display = 'flex';
            return;
        } else {
            // Log more detailed error information if available
            const errorDetails = await generatePromise.catch(err => err);
            console.error(`Detailed error:`, errorDetails);
            throw new Error('Failed to generate AI content');
            retryButton.style.display = 'block';
        }
    } catch (error) {
        console.error(`Failed:`, error);
       
        aiAnalysisElement.innerHTML = `
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p class="loading-text">Generating</p>
            </div>
        `;
        inputTaker.style.display = 'none';
    }
}

// Event listeners
document.getElementById('D5-submit-response').addEventListener('click', () => {

});

document.getElementById('D5-retry-ai-analysis').addEventListener('click', () => {

    const responseInput = document.getElementById('D5-ai-response-input');

});

document.getElementById('D5-text-to-speech').addEventListener('click', function() {
    const aiAnalysisElement = document.getElementById('D5-ai-analysis');
    const text = aiAnalysisElement.textContent || aiAnalysisElement.innerText;
    const speechButton = this;

    if (speechButton.textContent === 'Listen') {

        speech.onend = () => {
            speechButton.textContent = 'Listen';
        };
        window.speechSynthesis.speak(speech);
        speechButton.textContent = 'Stop';
    } else {
        window.speechSynthesis.cancel();
        speechButton.textContent = 'Listen';
    }
});

    let currentMonth = new Date().getMonth() + 1;

// Process data for the chart
function getDaysInMonth(month) {
    if (month === 2) { // February
        return 29;
    }
    const year = new Date().getFullYear(); // Current year for February calculation
    return new Date(year, month, 0).getDate();
}

// Process data for the chart
function prepareBirthdayChartData(month) {
    if (!month) {
        // Show total birthdays for each month
        const birthdaysByMonth = new Array(12).fill(0);
        const allBirthdays = getAllClientBirthdays();
        
        allBirthdays.forEach(person => {
            const birthDate = new Date(person.birthDate);
            const month = birthDate.getMonth();
            birthdaysByMonth[month]++;
        });

        return {
            labels: months,
            data: birthdaysByMonth
        };
    }

    // Show daily distribution for selected month
    const birthdays = getAllClientBirthdays(month);
    const totalDays = getDaysInMonth(month);
    
    // Create array for actual days in the month
    const daysInMonth = new Array(totalDays).fill(0);
    
    // Count birthdays for each day
    birthdays.forEach(person => {
        const birthDate = new Date(person.birthDate);
        const day = birthDate.getDate();
        if (day <= totalDays) { // Ensure day is within month's range
            daysInMonth[day - 1]++; // Subtract 1 because array is 0-based
        }
    });

    // Create labels for actual days in month
    const labels = Array.from({length: totalDays}, (_, i) => `Day ${i + 1}`);

    return {
        labels: labels,
        data: daysInMonth
    };
}

function updateKPIs(month = null) {
    const allBirthdays = getAllClientBirthdays();
    const selectedMonthBirthdays = month ? getAllClientBirthdays(month) : [];
    
    // Update total birthdays KPI
    const totalElement = document.getElementById('total-birthdays');
    totalElement.textContent = month ? selectedMonthBirthdays.length : allBirthdays.length;

    // Update percentage KPI
    const percentageElement = document.getElementById('birthday-percentage');
    const totalLabel = document.getElementById('total-birthdays-label');
    
    if (month && allBirthdays.length > 0) {
        const percentage = (selectedMonthBirthdays.length / allBirthdays.length) * 100;
        percentageElement.textContent = `${percentage.toFixed(1)}%`;
        totalLabel.textContent = 'Total birthdays in a month';
    } else {
        percentageElement.textContent = '100%';
        totalLabel.textContent = 'Total birthdays in all months';
    }
    updateKpiForAi("2", ` Total number of Birthday: ${totalElement.textContent}, Birthdays in ${month ? months[month-1] : 'All Months'} is ${percentageElement.textContent}% of the total number of Birthdays. `);

    // Update the table header based on selected month
    const tableHeader = document.querySelector('.table-header h5');
    if (tableHeader) {
        tableHeader.textContent = month ? `List of Birthdays in ${months[month - 1]}` : 'List of All Birthdays';
    }
    
    // Update upcoming birthdays KPI
    updateUpcomingBirthdays();
    
    // Update all birthdays table
    updateAllBirthdaysTable(month ? selectedMonthBirthdays : allBirthdays);
}

// New function to populate the all birthdays table
function updateAllBirthdaysTable(birthdays) {
    const tableBody = document.getElementById('all-birthday-list');
    if (!tableBody) return;
    
    const today = new Date();
    
    // Process birthdays with days until calculation
    const processedBirthdays = birthdays.map(person => {
        const birthDate = new Date(person.birthDate);
        const thisYearBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
        
        // Calculate days until next birthday
        let daysUntil;
        if (thisYearBirthday < today) {
            // Birthday already passed this year, calculate for next year
            const nextYearBirthday = new Date(today.getFullYear() + 1, birthDate.getMonth(), birthDate.getDate());
            daysUntil = Math.ceil((nextYearBirthday - today) / (1000 * 60 * 60 * 24));
        } else {
            daysUntil = Math.ceil((thisYearBirthday - today) / (1000 * 60 * 60 * 24));
        }
        
        return {
            ...person,
            birthDate,
            daysUntil
        };
    });
    
    // Sort birthdays by days until (ascending)
    processedBirthdays.sort((a, b) => a.daysUntil - b.daysUntil);
    
    // Populate table
    tableBody.innerHTML = processedBirthdays.map(person => {
        return `
            <tr>
                <td>${person.clientId}</td>
                <td>${person.name}</td>
                <td>${person.birthDate.toLocaleDateString()}</td>
                <td>${person.daysUntil} day${person.daysUntil !== 1 ? 's' : ''}</td>
            </tr>
        `;
    }).join('');
}

// Update the updateDashboard function to include KPI updates
function updateDashboard(month = null) {
    const { labels, data } = prepareBirthdayChartData(month);
    const periodLabel = month ? `Birthdays Distribution in ${months[month - 1]}` : 'Birthday Distribution by All Months';
    const cleanLabels = month ? labels.map(label => label.replace('Day ', '')) : labels;
    drawBarChart(
        'chart51',
        cleanLabels,
        data,
        periodLabel
    );

    updateKPIs(month);
    updateKpiForAi("1", ` ${periodLabel} ,  ${String(cleanLabels)} ,  ${String(data)} `);


}
    // Prepare data for birthday distribution pie chart across 12 months
    const allBirthdays = getAllClientBirthdays();
    const monthlyCounts = new Array(12).fill(0);

    allBirthdays.forEach(person => {
        const birthDate = new Date(person.birthDate);
        const birthMonth = birthDate.getMonth();
        monthlyCounts[birthMonth]++;
    });

    drawDonutChart(
        'chart52',
        months,
        monthlyCounts,
        'Birthday Distribution Across 12 Months',
        'right'
    );

function populateMonthDropdown() {
    const chooseMonth = document.getElementById("db5-choose-month");

    if (!chooseMonth) {
        console.error("Error: 'db5-choose-month' element not found.");
        return;
    }

    chooseMonth.innerHTML = `<option value="" style="text-align: center;">All Months</option>
        ${months.map((month, index) => `<option value="${index + 1}" style="text-align: center;">${month}</option>`).join('')}`;

    chooseMonth.addEventListener("change", function() {
        const selectedMonth = this.value ? parseInt(this.value) : null;
        updateDashboard(selectedMonth);
    });

    // Set initial month
    chooseMonth.value = currentMonth;
    updateDashboard(currentMonth);
}

function updateUpcomingBirthdays() {
    const upcomingElement = document.getElementById('upcoming-birthdays');
    const tableBody = document.getElementById('upcoming-birthday-list');
    const today = new Date();
    const daysFilter = parseInt(document.getElementById('days-filter').value, 10) || 7; // Default to 7 days if input is invalid
    const nextDate = new Date(today.getTime() + (daysFilter * 24 * 60 * 60 * 1000));
    
    const upcomingBirthdays = getAllClientBirthdays().filter(person => {
        const birthday = new Date(person.birthDate);
        let thisYearBirthday = new Date(today.getFullYear(), birthday.getMonth(), birthday.getDate());

        // If the birthday has already occurred this year and the filter is set to 366, consider next year's birthday
        if (thisYearBirthday < today && daysFilter === 366) {
            thisYearBirthday = new Date(today.getFullYear() + 1, birthday.getMonth(), birthday.getDate());
        }

        return thisYearBirthday >= today && thisYearBirthday <= nextDate;
    });

    upcomingElement.textContent = upcomingBirthdays.length;
    
    // Update the KPI label to reflect the number of days
    const kpiLabel = document.querySelector('#first-row-second-col-kpi-three .kpi-label');
    kpiLabel.textContent = `Upcoming birthdays (next ${daysFilter} days)`;
    
    // Sort by upcoming date
    upcomingBirthdays.sort((a, b) => {
        const dateA = new Date(a.birthDate);
        const dateB = new Date(b.birthDate);
        return dateA.getTime() - dateB.getTime();
    });

    // Populate table
    tableBody.innerHTML = upcomingBirthdays.map(person => {
        const birthDate = new Date(person.birthDate);
        const thisYearBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
        const daysUntil = Math.ceil((thisYearBirthday - today) / (1000 * 60 * 60 * 24));
        
        return `
            <tr>
                <td>${person.clientId}</td>
                <td>${person.name}</td>
                <td>${birthDate.toLocaleDateString()}</td>
                <td>${daysUntil} day${daysUntil > 0 ? 's' : ''}</td>
            </tr>
        `;
    }).join('');

    const formattedBirthdays = upcomingBirthdays.map(person => {
        const birthDate = new Date(person.birthDate);
        const thisYearBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
        const daysUntil = Math.ceil((thisYearBirthday - today) / (1000 * 60 * 60 * 24));
        return `
                    Client ID: ${person.clientId}
                    Name: ${person.name}
                    Birth Date: ${birthDate.toLocaleDateString()}
                    Days Until Birthday: ${daysUntil} day${daysUntil > 0 ? 's' : ''}
                    ----------------------------------------`;
                    }).join('\n');
    updateKpiForAi("3", ` Upcoming Birthdays (next 7 days from ${today.toLocaleDateString()}):\n${formattedBirthdays} `);

}

// Add event listener to update the table and label when the input changes
document.getElementById('days-filter').addEventListener('input', updateUpcomingBirthdays);
// Initialize dashboard
populateMonthDropdown();

</script>
