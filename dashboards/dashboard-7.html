<!-- Multi-language Speech-to-Text Script -->
<script>
    document.querySelectorAll('button[id$="-speech-to-text"]').forEach(button => {
      button.addEventListener('click', () => {
        const inputId = button.id.replace('-speech-to-text', '-ai-response-input');
        const inputElement = document.getElementById(inputId);
        const langSelector = document.getElementById("speech-lang-select");
        const selectedLang = langSelector ? langSelector.value : 'en-US';
  
        if (!inputElement) return;
  
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Your browser does not support Speech Recognition. Please use Chrome.");
          return;
        }
  
        const recognition = new SpeechRecognition();
        recognition.lang = selectedLang;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
  
        recognition.start();
  
        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          inputElement.value = transcript;
        };
  
        recognition.onerror = function(event) {
          alert("Speech recognition error: " + event.error);
        };
      });
    });
  </script>

<script>
    import { drawStackedBarChart,drawPieChart } from '../drawChart.js';

// AI START xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

let kpi_for_ai = new Proxy({}, {
    set(target, key, value) {
        target[key] = value;
        // Removed automatic call to updateAIAnalysis()
        return true;
    }
});

document.getElementById('db7-ai-container').style.display = 'none';
document.getElementById('D7-input-container').style.display = 'none';

document.getElementById('D7-generate-ai-report-button').addEventListener('click', () => {
    updateAIAnalysis();
    document.getElementById('db7-ai-container').style.display = 'block';
    document.getElementById('D7-generate-ai-report-button').style.display = 'none';
});

// Store the last used prompt to use for retries
let lastUsedPrompt = '';

function updateKpiForAi(key, value) {
    kpi_for_ai[key] = value;
}
async function updateAIAnalysis() {
    const aiAnalysisElement = document.getElementById('D7-ai-analysis');
    const retryButton = document.getElementById('D7-retry-ai-analysis');
    const responseInput = document.getElementById('D7-ai-response-input');
    const inputTaker = document.getElementById('D7-input-container');

    if (!aiAnalysisElement) return;

    // Hide retry button and input container initially
    retryButton.style.display = 'none';
    inputTaker.style.display = 'none';

    // Show loading state
// Show loading state
aiAnalysisElement.innerHTML = `
<div class="loading-container">
    <div class="loading-spinner"></div>
    <p class="loading-text">
        Generating AI insights...
    </p>
</div>
`;

    // Define the default prompt
    const defaultPrompt = `Generate analytic reports on:
        "Booking Cancellation Trends & Forecasts: What to Expect"
        "Future Cancellation Rates: Predicting Guest Retention Challenges"
        "Cancellation Risk Assessment: Trends and Future Projections"`;

    // Determine the prompt to use
    const userPrompt = responseInput.value.trim();
    
    // Update last used prompt, prioritizing user input
    lastUsedPrompt = userPrompt || lastUsedPrompt || defaultPrompt;

    const chartDataString = Object.values(kpi_for_ai).filter(Boolean).join('\n');
    const combinedPrompt = `${lastUsedPrompt}\nBased on the following booking data:\n${chartDataString}`;

    try {
        console.log(`Generating AI content`);
        
        // Improved timeout and error handling
        const generatePromise = generateAiContent('D7-ai-analysis', combinedPrompt, '');
        
        const status = await Promise.race([
            generatePromise,
            new Promise((_, reject) => setTimeout(() => {
                console.log(`Timeout`);
                reject(new Error('Request timeout'));
            }, 30000))
        ]);

        console.log(`Status:`, status);

        if (status === 'success') {
            inputTaker.style.setProperty('display', 'flex', 'important');
            return;
        } else {
            // Log more detailed error information if available
            const errorDetails = await generatePromise.catch(err => err);
            console.error(`Detailed error:`, errorDetails);
            throw new Error('Failed to generate AI content');
            retryButton.style.display = 'block';
        }
    } catch (error) {
        console.error(`Failed:`, error);
       
// Show loading state
aiAnalysisElement.innerHTML = `
<div class="loading-container">
    <div class="loading-spinner"></div>
    <p class="loading-text">
        Generating AI insights...
    </p>
</div>
`;
        inputTaker.style.display = 'none';
    }
}

// Event listeners
document.getElementById('D7-submit-response').addEventListener('click', () => {
    updateAIAnalysis();
});

document.getElementById('D7-retry-ai-analysis').addEventListener('click', () => {
    // Use the last used prompt when retrying
    const responseInput = document.getElementById('D7-ai-response-input');
    responseInput.value = lastUsedPrompt;
    updateAIAnalysis();
});

document.getElementById('D7-text-to-speech').addEventListener('click', function() {
    const aiAnalysisElement = document.getElementById('D7-ai-analysis');
    const text = aiAnalysisElement.textContent || aiAnalysisElement.innerText;
    const speechButton = this;

    if (speechButton.textContent === 'Listen') {
        const speech = new SpeechSynthesisUtterance(text);
        speech.onend = () => {
            speechButton.textContent = 'Listen';
        };
        window.speechSynthesis.speak(speech);
        speechButton.textContent = 'Stop';
    } else {
        window.speechSynthesis.cancel();
        speechButton.textContent = 'Listen';
    }
});

    // Global variables for state management
let globalSelectedYear = '';
let globalSelectedMonth = '';

// let currentYear = new Date().getFullYear();
// let currentMonth = new Date().getMonth() + 1;
let currentYear = 2025;
let currentMonth = 3;
const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const full_months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const availableYears = generate_Barchart_dashboard_1_inYears()[0];
let bar = true;
const status_color = {
    Q: "rgba(255, 206, 86, 0.7)", // Yellow for Quote
    E: "rgba(255, 99, 132, 0.7)", // Red for Quote Rejected
    W: "rgba(153, 102, 255, 0.7)", // Purple for Waiting List
    I: "rgba(75, 192, 192, 0.7)", // Teal for Internet
    P: "#009E73", // Blue for Provisional
    C: "rgba(255, 255, 255, 0.7)", // Orange for Confirmed
    D: "rgba(201, 203, 207, 0.7)", // Grey for Deposit Paid
    U: "rgba(0, 255, 0, 0.7)", // Green for Fully Paid
    A: "#0072B2", // Dark Green for Active
    L: "rgba(128, 128, 128, 0.7)", // Grey for Left
    N: "rgba(139, 69, 19, 0.7)", // Brown for No Show
    F: "rgba(255, 0, 0, 0.7)", // Red for Faulty
    X: "#CC79A7", // Crimson for Cancelled
    O: "rgba(0, 0, 139, 0.7)", // Dark Blue for Closed
    R: "rgba(128, 0, 0, 0.7)", // Maroon for Restricted
  };

// Define status code mappings
const statusLabels = {
  'Q': 'Quote',
  'E': 'Quote Rejected',
  'W': 'Waiting List',
  'I': 'Internet',
  'P': 'Provisional',
  'C': 'Confirmed',
  'D': 'Deposit Paid',
  'U': 'Fully Paid',
  'A': 'Active',
  'L': 'Left',
  'N': 'No Show',
  'F': 'Faulty',
  'X': 'Cancelled',
  'O': 'Closed',
  'R': 'Restricted'
};


function handleDropdown() {
    const chooseYear = document.getElementById("db7-choose-year");
    const chooseMonth = document.getElementById("db7-choose-month");

    if (!chooseYear || !chooseMonth) {
        console.error("Dropdown elements not found.");
        return;
    }

    // Create dropdown for selecting a year
    chooseYear.innerHTML = `<option value="" style="text-align: center;">All Years</option>
    ${availableYears.map(year => `<option value="${year}" style="text-align: center;">${year}</option>`).join('')}`;
    
    chooseYear.value = currentYear;  // Set current year as default
    globalSelectedYear = currentYear;  // Set global selected year to current year

    chooseYear.addEventListener("change", function () {
        globalSelectedYear = this.value;

        // Reset month selection when a new year is selected
        globalSelectedMonth = '';
        chooseMonth.value = ''; 
        chooseMonth.style.display = globalSelectedYear === "" ? "none" : "inline";

        if (globalSelectedYear !== "") {
            populateMonthDropdown();
        }

        updateCharts(parseInt(globalSelectedYear), globalSelectedMonth ? parseInt(globalSelectedMonth) : null);
    });

    // Handle month selection change
    chooseMonth.addEventListener("change", function () {
        globalSelectedMonth = this.value;
        if (this.value === "") {
            globalSelectedMonth = '';  // Reset to empty string for "All Months"
        }

        updateCharts(parseInt(globalSelectedYear), parseInt(globalSelectedMonth));
    });
}

function populateMonthDropdown() {
    const chooseMonth = document.getElementById("db7-choose-month");

    if (!chooseMonth) {
        console.error("Error: 'db7-choose-month' element not found.");
        return;
    }

    // Populate the month dropdown
    chooseMonth.innerHTML = `<option value="" style="text-align: center;">All Months</option>
        ${months.map((month, index) => `<option value="${index + 1}" style="text-align: center;">${month}</option>`).join('')}`;

    if (bar) {
        chooseMonth.value = currentMonth;
        globalSelectedMonth = currentMonth;
        bar = false;
        updateCharts(parseInt(globalSelectedYear), parseInt(globalSelectedMonth));
    }
}

function getDaysInMonth(year, month) {
    // For all years view or year-only view, return 31 days
    if (!month) return 31;
    return new Date(year, month, 0).getDate();
}

function updateCharts(year = currentYear, month = currentMonth) {
    let pieChartData, barChartData;
    let periodLabel = '';
    let barChartLabels = [];

    if (!globalSelectedYear) {
        // All Years view
        pieChartData = generateBookingStatusChartData();
        barChartData = generateBookingStatusChartData(null, null, statusLabels);
        periodLabel = 'All Years';
        barChartLabels = availableYears;
    } else if (!globalSelectedMonth) {
        // Specific year view
        pieChartData = generateBookingStatusChartData(parseInt(globalSelectedYear));
        barChartData = generateBookingStatusChartData(parseInt(globalSelectedYear), null, statusLabels);
        periodLabel = `Year ${globalSelectedYear}`;
        barChartLabels = months;
    } else {
        // Specific month view
        pieChartData = generateBookingStatusChartData(parseInt(globalSelectedYear), parseInt(globalSelectedMonth));
        barChartData = generateBookingStatusChartData(parseInt(globalSelectedYear), parseInt(globalSelectedMonth), statusLabels);
        periodLabel = `${months[parseInt(globalSelectedMonth) - 1]} ${globalSelectedYear}`;
        const daysInMonth = getDaysInMonth(globalSelectedYear, globalSelectedMonth);
        barChartLabels = Array.from({length: daysInMonth}, (_, i) => i + 1);
    }

    // Transform pie chart labels to include descriptions
    const pieLabels = pieChartData.labels.map(label => `${label} - ${statusLabels[label] || label}`);

    // Calculate totals for KPIs
    const totalBookings = pieChartData.data.reduce((sum, count) => sum + count, 0);
    const activeBookings = pieChartData.labels.reduce((sum, label, index) => {
        if (['A', 'D', 'U', 'P', 'C'].includes(label)) {
            return sum + pieChartData.data[index];
        }
        return sum;
    }, 0);
    const completedBookings = pieChartData.labels.reduce((sum, label, index) => {
        if (['L', 'O'].includes(label)) {
            return sum + pieChartData.data[index];
        }
        return sum;
    }, 0);

    // Update KPIs
    document.getElementById('Canceled').innerHTML = 
        `<h4>Cancelled Bookings</h4>
        <p>${pieChartData.labels.reduce((sum, label, index) => {
            if (['X'].includes(label)) {
                return sum + pieChartData.data[index];
            }
            return sum;
        }, 0).toLocaleString()}</p>
        <small>${periodLabel}</small>`;
        
    document.getElementById('Pending').innerHTML = 
        `<h4>Provisional Bookings</h4>
        <p>${pieChartData.labels.reduce((sum, label, index) => {
            if (['Q', 'W', 'I', 'P'].includes(label)) {
                return sum + pieChartData.data[index];
            }
            return sum;
        }, 0).toLocaleString()}</p>
        <small>${periodLabel}</small>`;
        
    document.getElementById('Accpeted').innerHTML = 
        `<h4>Accepted Bookings</h4>
        <p>${pieChartData.labels.reduce((sum, label, index) => {
            if (['C', 'D', 'U', 'A'].includes(label)) {
                return sum + pieChartData.data[index];
            }
            return sum;
        }, 0).toLocaleString()}</p>
        <small>${periodLabel}</small>`;

    // Draw the charts
    const pieChartDataWithColors = {
        labels: pieLabels,
        data: pieChartData.data,
        backgroundColor: pieChartData.labels.map(label => status_color[label])
    };

    drawPieChart('chart71', pieChartDataWithColors.labels, pieChartDataWithColors,
        !globalSelectedYear ? 'Booking Status Percentages for All Time' :
        !globalSelectedMonth ? `Booking Status Percentages for ${globalSelectedYear}` :
        `Booking Status Percentages for ${full_months[globalSelectedMonth-1]}, ${globalSelectedYear}`, 
        'top');
    
    updateKpiForAi("2" , `Total number of each status: ${pieLabels.map((label, index) => `${label}:${pieChartData.data[index]}`).join(', ')}`);


    drawStackedBarChart(
        'chart72',
        barChartLabels,
        barChartData.datasets
    );

    updateKpiForAi("1" , `Stacked Bar Chart Data for ${periodLabel}: Time periods- ${barChartLabels.join(', ')}, ${barChartData.datasets.map(dataset => `${dataset.label}: ${dataset.data.join(', ')}`).join('; ')}`);


}

// Initialize the dashboard
handleDropdown();
populateMonthDropdown();
// Set the charts for the current month and year by default
updateCharts(currentYear, currentMonth);


// Restore AI State
setTimeout(() => {
  const savedAi = localStorage.getItem('ai_result_D7-ai-analysis');
  if (savedAi) {

    if (inputContainer) inputContainer.style.display = 'flex';
    const btn = document.getElementById('D7-generate-ai-report-button');
    if (btn) btn.style.display = 'none';
  }
}, 500);
